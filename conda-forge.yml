conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main

# MetaMorpheus ships prebuilt .NET assemblies; recipe/build.sh compiles nothing and only copies
# files plus a launcher, so these platforms are cross-rendered from their x86_64 counterparts.
# None of the three is emitted by a plain rerender, so they are requested explicitly.
# win_arm64 became possible once the runtime pin moved to .NET 10: conda-forge has no
# dotnet-runtime 8.0.6 for it, which is what previously kept it out, but it does have 10.0.10
# and 10.0.11.
build_platform:
  osx_arm64: osx_64
  linux_aarch64: linux_64
  win_arm64: win_64
